name: CI

on:
  push:
    branches: [main, autark-v1]
  pull_request:
    branches: [main, autark-v1]

env:
  RUST_VERSION: "1.89.0"
  SOLANA_VERSION: "3.1.14"
  ANCHOR_VERSION: "1.0.2"

jobs:
  anchor-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ env.RUST_VERSION }}"
          components: rustfmt, clippy

      - name: Cache cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo target dirs
        uses: actions/cache@v4
        with:
          path: |
            target/
            programs/*/target/
          key: cargo-target-${{ runner.os }}-${{ env.ANCHOR_VERSION }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Solana CLI install + platform-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}

      - name: Install pinned Solana CLI (Anza/Agave)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # Anchor is installed as a PREBUILT binary, not compiled via `cargo
      # install avm` / `avm install`. Reason: current Anchor source pulls in
      # cargo-platform@0.3.3, which requires rustc >=1.91 to compile — but
      # this workflow pins Rust to 1.89.0 to match the program's local build
      # toolchain, and avm cannot build under 1.89. Compiling avm under a
      # second, newer Rust toolchain just to produce a 1.0.2 binary was the
      # documented fallback for this problem, but turned out to be
      # unnecessary: coral-xyz/anchor publishes an official prebuilt
      # x86_64-unknown-linux-gnu binary for v1.0.2 (the repo now redirects to
      # otter-sec/anchor, but release asset URLs follow the redirect fine).
      # This also means zero Rust compilation of Anchor itself happens in CI
      # — only our program is ever built with the pinned 1.89.0 toolchain.
      - name: Cache Anchor CLI binary
        id: anchor-bin-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/anchor
          key: anchor-bin-${{ runner.os }}-${{ env.ANCHOR_VERSION }}

      - name: Install pinned Anchor (prebuilt binary, no compilation)
        if: steps.anchor-bin-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" \
            "https://github.com/coral-xyz/anchor/releases/download/v${{ env.ANCHOR_VERSION }}/anchor-${{ env.ANCHOR_VERSION }}-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/anchor"

      - name: Add Anchor to PATH and verify version
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          version_output="$("$HOME/.local/bin/anchor" --version)"
          echo "$version_output"
          case "$version_output" in
            "anchor-cli ${{ env.ANCHOR_VERSION }}") ;;
            *)
              echo "::error::Expected anchor-cli ${{ env.ANCHOR_VERSION }}, got: $version_output"
              exit 1
              ;;
          esac

      - name: Versions
        run: |
          rustc --version
          solana --version
          anchor --version

      - name: anchor build
        # target/deploy/autark-keypair.json is gitignored (it's the program's
        # private key), so CI generates a random throwaway one that can't
        # match declare_id! in source. CI only builds, never deploys, so the
        # real program ID doesn't matter here — skip the consistency check.
        run: anchor build --ignore-keys

      # TODO(Tier 1): once v1 program tests exist, uncomment this step.
      # v0's tests are being removed in Tier 0 and there is currently nothing
      # meaningful to run here — do not enable until real v1 tests land.
      # - name: anchor test
      #   run: anchor test
